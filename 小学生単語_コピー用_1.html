<!DOCTYPE html>

<style>
 :root{color-scheme:light dark}
 body{font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;
   margin:0;padding:20px;background:#f6f7f9;color:#1a1a1a}
 @media(prefers-color-scheme:dark){body{background:#1c1d20;color:#eee}}
 h1{font-size:18px;margin:0 0 4px}
 p.note{font-size:12px;color:#777;margin:0 0 18px}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
 section{background:#fff;border:1px solid #e3e5e9;border-radius:12px;padding:14px 16px}
 @media(prefers-color-scheme:dark){section{background:#26272b;border-color:#3a3b40}}
 h2{font-size:15px;margin:2px 0 12px;padding-bottom:8px;border-bottom:1px solid #eee}
 @media(prefers-color-scheme:dark){h2{border-color:#3a3b40}}
 .row{display:flex;gap:8px;align-items:center;margin:6px 0}
 .chip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;
   border:1px solid #d4d7dd;background:#fafbfc;border-radius:8px;
   padding:5px 9px;font:inherit;color:inherit;transition:.15s}
 @media(prefers-color-scheme:dark){.chip{background:#303136;border-color:#45464c}}
 .chip:hover{border-color:#4c8bf5;background:#eef4ff}
 @media(prefers-color-scheme:dark){.chip:hover{background:#2f3a4d}}
 .chip code{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:15px}
 .row .chip:first-child{min-width:120px}
 .chip.done{border-color:#2ea043;background:#e8f5ec}
 @media(prefers-color-scheme:dark){.chip.done{background:#213728}}
 .chip.done code{color:#2ea043}
 .chip.done::after{content:'コピー✓';font-size:11px;color:#2ea043;margin-left:2px}
 .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
   background:#1a1a1a;color:#fff;padding:8px 16px;border-radius:20px;
   font-size:13px;opacity:0;transition:.2s;pointer-events:none}
 .toast.show{opacity:.95}

<div class="toast" id="toast"></div>
<script>
function copyText(txt){
 if(navigator.clipboard&&navigator.clipboard.writeText){
   return navigator.clipboard.writeText(txt);
 }
 return new Promise((res,rej)=>{
   var ta=document.createElement('textarea');
   ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
   document.body.appendChild(ta);ta.focus();ta.select();
   try{document.execCommand('copy');res();}catch(e){rej(e);}
   document.body.removeChild(ta);
 });
}
function cp(el,txt){
 copyText(txt).then(()=>{
   document.querySelectorAll('.chip.done').forEach(c=>c.classList.remove('done'));
   el.classList.add('done');
   setTimeout(()=>el.classList.remove('done'),1200);
   var t=document.getElementById('toast');
   t.textContent='コピー: '+txt;t.classList.add('show');
   clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),1200);
 });
}
</script>
