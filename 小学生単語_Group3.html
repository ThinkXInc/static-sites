<script>
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);return new Promise((res,rej)=>{var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');res();}catch(e){rej(e);}document.body.removeChild(a);});}
function cp(el,t){copyText(t).then(()=>{document.querySelectorAll('.chip.done').forEach(c=>c.classList.remove('done'));el.classList.add('done');setTimeout(()=>el.classList.remove('done'),1200);var x=document.getElementById('toast');x.textContent='コピー: '+t;x.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>x.classList.remove('show'),1200);});}
</script></body></html>
